name: Publish Evening Edition (6:00 PM IST)

on:
  schedule:
    # Staggered cron schedule across evening IST to guarantee execution even during GitHub peak runner queue congestion.
    # 12:18 UTC = 05:48 PM IST (Early evening release)
    - cron: "18 12 * * *"
    # 12:48 UTC = 06:18 PM IST (Post-6:00 PM primary run)
    - cron: "48 12 * * *"
    # 13:18 UTC = 06:48 PM IST (1st backup retry)
    - cron: "18 13 * * *"
    # 13:48 UTC = 07:18 PM IST (2nd backup retry)
    - cron: "48 13 * * *"
    # 14:18 UTC = 07:48 PM IST (3rd backup retry)
    - cron: "18 14 * * *"
    # 14:48 UTC = 08:18 PM IST (4th backup retry)
    - cron: "48 14 * * *"
    # 15:18 UTC = 08:48 PM IST (5th backup retry)
    - cron: "18 15 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date in YYYY-MM-DD (defaults to today in IST)"
        required: false
        default: ""
      force_regenerate:
        description: "Force overwrite if edition already exists"
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [publish-evening, publish-edition]
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/evening-edition.yml"
      - "scripts/**"
      - "data/sources.json"

permissions:
  contents: write

concurrency:
  group: publish-edition-evening
  cancel-in-progress: false

jobs:
  generate-and-publish-evening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Evening Edition Pipeline
        env:
          PYTHONIOENCODING: "utf-8"
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            HOUR_IST=$(python3 -c "import datetime; print(datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).hour)")
            if [ "$HOUR_IST" -lt 17 ]; then
              echo "Push occurred before evening window (current IST hour: $HOUR_IST). Skipping evening edition."
              exit 0
            fi
          fi

          ARGS="--edition evening"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_regenerate }}" != "false" ]; then
              ARGS="$ARGS --force"
            fi
          fi
          python3 -m scripts.publish_edition $ARGS

      - name: Commit and Push Updated Archive to GitHub Pages
        run: |
          git config user.name "tn-politics-brief-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(edition): publish evening brief $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push origin main
          fi

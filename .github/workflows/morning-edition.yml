name: Publish Morning Edition (6:00 AM IST)

on:
  schedule:
    # 00:22 UTC = 05:52 AM IST (Primary morning release)
    - cron: "22 0 * * *"
    # 00:52 UTC = 06:22 AM IST (1st backup retry if GitHub dropped 00:22)
    - cron: "52 0 * * *"
    # 01:22 UTC = 06:52 AM IST (2nd backup retry)
    - cron: "22 1 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date in YYYY-MM-DD (defaults to today in IST)"
        required: false
        default: ""
      force_regenerate:
        description: "Force overwrite if edition already exists"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-edition-morning
  cancel-in-progress: false

jobs:
  generate-and-publish-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Edition Pipeline
        env:
          PYTHONIOENCODING: "utf-8"
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          ARGS="--edition morning"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_regenerate }}" != "false" ]; then
              ARGS="$ARGS --force"
            fi
          fi
          python3 -m scripts.publish_edition $ARGS

      - name: Commit and Push Updated Archive to GitHub Pages
        run: |
          git config user.name "tn-politics-brief-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(edition): publish morning brief $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push origin main
          fi

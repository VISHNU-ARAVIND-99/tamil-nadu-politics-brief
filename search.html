<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Search | Tamil Nadu Politics Brief</title>
    <link rel="icon" type="image/png" sizes="128x128" href="assets/images/favicon.png">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css?v=20261101_v4">
</head>

<body>
    <header class="masthead">
        <div class="container">
            <div class="masthead-utility-bar">
                <span id="ist-date-display" class="date-chip">Asia/Kolkata (IST)</span>
                <button id="theme-toggle" class="theme-btn" type="button">Dark Mode</button>
            </div>
            <div class="masthead-brand">
                <a href="index.html" class="masthead-logo-link" aria-label="Home">
                    <img src="assets/images/logo.png" alt="Tamil Nadu Politics Brief Emblem" class="masthead-logo" width="76" height="76">
                </a>
                <h1 class="masthead-title"><a href="index.html">Tamil Nadu Politics Brief</a></h1>
                <p class="masthead-tagline">"Tamil Nadu Politics. Zero Noise. 100% Verified."</p>
            </div>
            <nav class="nav-bar" aria-label="Primary Navigation">
                <a href="index.html" class="active">Latest Briefings</a>
                <a href="edition.html">Full Edition View</a>
                <a href="archive.html">Historical Archive</a>
                <a href="search.html">Keyword Search</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 style="margin-bottom:0.75rem;">Search Historical Briefings</h2>
        <div class="filter-bar" style="grid-template-columns:1fr;">
            <div>
                <label for="search-query-input">Search by Party, Leader, Policy, Issue, or District</label>
                <input type="search" id="search-query-input"
                    placeholder="Type DMK, AIADMK, TVK, BJP, Chief Minister, NEET, Assembly, Agriculture, Chennai...">
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.4rem;">
                <button type="button" class="theme-btn quick-chip" data-keyword="DMK">DMK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="AIADMK">AIADMK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="TVK">TVK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="BJP">BJP</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="INC">Congress</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="PMK">PMK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="NTK">NTK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="VCK">VCK</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="NEET">NEET</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="Assembly">Tamil Nadu Assembly</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="Agriculture">Agriculture</button>
                <button type="button" class="theme-btn quick-chip" data-keyword="Chennai">Chennai</button>
            </div>
        </div>

        <div id="search-results-list"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p><strong>Tamil Nadu Politics Brief</strong> &mdash; Instant Archive Search.</p>
        </div>
    </footer>

    <script src="assets/js/app.js"></script>
</body>

</html>
